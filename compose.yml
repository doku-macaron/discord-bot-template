services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: discord_bot
            POSTGRES_USER: discord_bot
            POSTGRES_PASSWORD: discord_bot
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - postgres-data:/var/lib/postgresql/data

    bot:
        build:
            context: .
            target: bot
        environment:
            TOKEN: ${TOKEN:?Set TOKEN in .env}
            CLIENT_ID: ${CLIENT_ID:-}
            GUILD_ID: ${GUILD_ID:-}
            DATABASE_URL: postgres://discord_bot:discord_bot@postgres:5432/discord_bot
            WEBHOOK_URL: ${WEBHOOK_URL:-}
            # Optional features (off by default).
            BOT_API_ENABLED: ${BOT_API_ENABLED:-false}
            BOT_API_HOST: 0.0.0.0
            BOT_API_PORT: ${BOT_API_PORT:-8080}
            BOT_API_TOKEN: ${BOT_API_TOKEN:-}
            SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    migrate:
        build:
            context: .
            target: tools
        profiles: ["tools"]
        environment:
            DATABASE_URL: postgres://discord_bot:discord_bot@postgres:5432/discord_bot
        depends_on:
            postgres:
                condition: service_healthy

    register:
        build:
            context: .
            target: bot
        command: ["bun", "--filter", "@repo/bot", "register"]
        profiles: ["tools"]
        environment:
            TOKEN: ${TOKEN:?Set TOKEN in .env}
            CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in .env}
            GUILD_ID: ${GUILD_ID:-}
            WEBHOOK_URL: ${WEBHOOK_URL:-}

volumes:
    postgres-data:
