pre-push:
  commands:
    01-check:
      run: bun check:no-save
    02-check-tsc:
      run: bun check:tsc

pre-commit:
  commands:
    01-create-env:
      run: NODE_ENV=setup bun run scripts/createEnv.ts
    02-check:
      run: bun check
      stage_fixed: true
    03-check-tsc:
      run: bun check:tsc
